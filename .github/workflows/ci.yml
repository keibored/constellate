name: Verify deployable build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: constellate
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: constellate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U constellate -d constellate_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://constellate:test-only-password@127.0.0.1:5432/constellate_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: npm run test:redis
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: .vite/production-report.json
