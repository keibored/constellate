# Backend-only production baseline. The React frontend is deployed once on Vercel.
# The Vercel production origin is prompted; datastore credentials stay server-only.
services:
  - type: web
    name: constellate-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build --workspace=server
    preDeployCommand: npm run db:migrate:production
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: HEALTH_TIMEOUT_MS
        value: "2000"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "25000"
      - key: DATABASE_URL
        fromDatabase:
          name: constellate-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: constellate-redis
          property: connectionString
      - key: REDIS_KEY_PREFIX
        value: constellate:production

  - type: keyvalue
    name: constellate-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: constellate-postgres
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: "18"
    databaseName: constellate
    ipAllowList: []
