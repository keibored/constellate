# Reviewed paid production baseline. Import only into the intended Render account.
# Public frontend/API origins are prompted; database credentials stay server-only.
services:
  - type: web
    name: constellate-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build --workspace=server
    preDeployCommand: npm run db:migrate:production
    startCommand: node server/dist/index.js
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: HEALTH_TIMEOUT_MS
        value: "2000"
      - key: SHUTDOWN_TIMEOUT_MS
        value: "25000"
      - key: DATABASE_URL
        fromDatabase:
          name: constellate-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: constellate-redis
          property: connectionString
      - key: REDIS_KEY_PREFIX
        value: constellate:production

  - type: web
    name: constellate-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=client
    staticPublishPath: client/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: VITE_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: keyvalue
    name: constellate-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: constellate-postgres
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: "18"
    databaseName: constellate
    ipAllowList: []
